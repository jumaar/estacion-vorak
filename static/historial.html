<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORAK - Historial Estación de Pesaje</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Página de Historial -->
        <div id="historial-page" class="page active">
            <div class="products-container">
                <div class="products-header">
                    <h1>Historial de Empaques</h1>
                    <p>Lista de productos procesados</p>
                    <button id="volver-dashboard-btn" class="btn btn-success">Volver al Dashboard</button>
                </div>
                    <!-- Div para búsqueda de empaques por EPC -->
            <div class="busqueda-empaque-container">
                <div class="busqueda-empaque-header">
                    <div class="busqueda-input-container">
                        <input type="text" id="epc-input" class="epc-input" maxlength="24" placeholder="Ingrese EPC (máximo 24 caracteres)">
                        <button id="buscar-epc-btn" class="btn btn-primary">Buscar</button>
                    </div>
                <div class="busqueda-empaque-table-container">
                    <table class="products-table">
                        <tbody id="busqueda-empaque-list">
                            <tr>
                                <td colspan="6">Ingrese un EPC para buscar un empaque específico</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
                <div class="dashboard-summary">
                    

                    <div class="summary-card">
                        <h3 class="card-title">Productos Hoy</h3>
                        <div class="card-value" id="productos-hoy">0</div>
                        <p class="card-description">Empaques procesados</p>
                    </div>

                    <div class="summary-card">
                        <h3 class="card-title">Peso Total</h3>
                        <div class="card-value" id="peso-total">0.0</div>
                        <p class="card-description">kg procesados</p>
                    </div>

                    
                </div>

                <div class="products-table-container">
                    <table class="products-table">
                        <tbody id="historial-list">
                            <tr>
                                <td colspan="6">Cargando historial...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
        
    </div>

    <!-- Cargar la librería de cliente de Socket.IO para un manejo limpio de la desconexión -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
