# .github/workflows/release-production.yml

name: CI/CD - Release to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # =================================================================================
  # JOB 1: Construye .deb con Tauri
  # =================================================================================
  build-deb:
    name: Build .deb (Tauri)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev librsvg2-dev patchelf dpkg-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build .deb
        run: npm run build:deb
        env:
          CI: true

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: vorak-estacion-deb
          path: src-tauri/target/release/bundle/deb/*.deb

  # =================================================================================
  # JOB 2: Prepara la matriz de despliegue a partir del inventario
  # =================================================================================
  prepare-deployment-matrix:
    name: Prepare Deployment Matrix
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.set-matrix.outputs.hosts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Create matrix from inventory
        id: set-matrix
        run: echo "hosts=$(jq -c '.devices' .github/workflows/fleet-inventory.json)" >> $GITHUB_OUTPUT

  # =================================================================================
  # JOB 3: Despliega en la flota de dispositivos IoT
  # =================================================================================
  deploy-to-production:
    name: Deploy to Production Fleet
    needs: [build-deb, prepare-deployment-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.prepare-deployment-matrix.outputs.hosts) }}
      max-parallel: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: vorak-estacion-deb
          path: ./deb-package

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH and Cloudflare
        env:
          SSH_PRIVATE_KEY: ${{ secrets.IOT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.IOT_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host ${{ matrix.host }}" >> ~/.ssh/config
          echo "  ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy to ${{ matrix.host }}
        run: |
          echo 'echo "${{ secrets.IOT_PASSPHRASE }}"' > askpass.sh
          chmod +x askpass.sh

          eval $(ssh-agent -s)
          DISPLAY=:0 SSH_ASKPASS=./askpass.sh ssh-add ~/.ssh/id_rsa

          DEB_FILE=$(ls ./deb-package/*.deb | head -1)

          scp -o StrictHostKeyChecking=no "$DEB_FILE" ${{ secrets.IOT_USERNAME }}@${{ matrix.host }}:/tmp/vorak-estacion.deb

          ssh -o StrictHostKeyChecking=no ${{ secrets.IOT_USERNAME }}@${{ matrix.host }} << EOF
            set -e
            echo "--- Instalando .deb en ${{ matrix.host }} ---"

            sudo dpkg -i /tmp/vorak-estacion.deb

            sudo modprobe usblp

            if [ -f /opt/vorak-estacion/resources/99-vorak-estacion.rules ]; then
              sudo cp /opt/vorak-estacion/resources/99-vorak-estacion.rules /etc/udev/rules.d/
              sudo udevadm control --reload-rules
              sudo udevadm trigger
            fi

            if [ -f /opt/vorak-estacion/resources/vorak-estacion.service ]; then
              sudo cp /opt/vorak-estacion/resources/vorak-estacion.service /etc/systemd/system/
              sudo sed -i "s/User=kiosk/User=${{ secrets.IOT_USERNAME }}/g" /etc/systemd/system/vorak-estacion.service
              sudo sed -i "s/Group=kiosk/Group=${{ secrets.IOT_USERNAME }}/g" /etc/systemd/system/vorak-estacion.service
              sudo systemctl daemon-reload
              sudo systemctl enable vorak-estacion
            fi

            sudo systemctl restart vorak-estacion

            rm /tmp/vorak-estacion.deb

            echo "--- Despliegue completado en ${{ matrix.host }} ---"
            echo "Iniciando reinicio en segundo plano..."
            nohup bash -c 'sleep 5 && sudo /sbin/reboot' > /dev/null 2>&1 &
          EOF
