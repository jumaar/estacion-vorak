[package]
name = "vorak-estacion"
version = "2.0.1"
description = "Estacion de pesaje VORAK"
authors = ["VORAK"]
edition = "2021"

[lib]
name = "vorak_estacion_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
libc = "0.2"
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
chrono = { version = "0.4", features = ["clock"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
reqwest = "0.13"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
futures-util = "0.3"
tauri-plugin-store = "2.4.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[package.metadata.deb]
name = "vorak-estacion"
maintainer = "VORAK <jumaar1988@hotmail.com>"
section = "utils"
priority = "optional"
depends = "libwebkit2gtk-4.1-0, libssl3, libgtk-3-0, librsvg2-2, patchelf, pkexec | policykit-1"
extended-description = "Estacion de pesaje VORAK - sistema IoT de monitoreo y control"
assets = [
    ["target/release/vorak-estacion", "usr/bin/vorak-estacion", "755"],
    ["deploy/postinst", "DEBIAN/postinst", "755"],
    ["deploy/vorak-estacion.desktop", "usr/share/applications/vorak-estacion.desktop", "644"],
    ["deploy/vorak-estacion.png", "usr/share/pixmaps/vorak-estacion.png", "644"],
    ["resources/config.json", "usr/lib/vorak-estacion/resources/config.json", "644"],
    ["resources/printer_settings.json", "usr/lib/vorak-estacion/resources/printer_settings.json", "644"],
    ["resources/99-vorak-estacion.rules", "usr/lib/vorak-estacion/resources/99-vorak-estacion.rules", "644"],
    ["resources/vorak-estacion.service", "usr/lib/vorak-estacion/resources/vorak-estacion.service", "644"],
    ["deploy/setup-autologin.sh", "usr/lib/vorak-estacion/resources/setup-autologin.sh", "644"],
    ["resources/fonts/DejaVuSans-Bold.ttf", "usr/lib/vorak-estacion/resources/fonts/DejaVuSans-Bold.ttf", "644"],
]
