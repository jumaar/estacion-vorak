[package]
name = "vorak-estacion"
version = "2.0.0"
description = "Estacion de pesaje VORAK"
authors = ["VORAK"]
edition = "2021"

[lib]
name = "vorak_estacion_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
libc = "0.2"
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
chrono = { version = "0.4", features = ["clock"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
reqwest = "0.13"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
futures-util = "0.3"
tauri-plugin-store = "2.4.4"

[package.metadata.deb]
name = "vorak-estacion"
maintainer = "VORAK <jumaar1988@hotmail.com>"
section = "utils"
priority = "optional"
depends = "libwebkit2gtk-4.1-0, libssl3, libgtk-3-0, librsvg2-2, patchelf, pkexec | policykit-1"
extended-description = "Estacion de pesaje VORAK - sistema IoT de monitoreo y control"
assets = [
    ["deploy/postinst", "DEBIAN/postinst", "755"],
    ["deploy/update-app.sh", "opt/vorak-estacion/update-app.sh", "755"],
    ["deploy/vorak-estacion-sudo", "etc/sudoers.d/vorak-estacion", "440"],
    ["resources/", "usr/lib/vorak-estacion/", "644"],
]
